apiVersion: v1
kind: Service
metadata:
  name: kornilov-db
  namespace: kornilov-ns
spec:
  clusterIP: None
  selector:
    app: kornilov-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kornilov-db
  namespace: kornilov-ns
spec:
  serviceName: kornilov-db
  replicas: 1
  selector:
    matchLabels:
      app: kornilov-postgres
  template:
    metadata:
      labels:
        app: kornilov-postgres
    spec:
      containers:
        - name: kornilov-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: study
            - name: POSTGRES_USER
              value: userdb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kornilov-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: kornilov-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "userdb", "-d", "study"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: kornilov-postgres-data
          persistentVolumeClaim:
            claimName: kornilov-postgres-pvc
