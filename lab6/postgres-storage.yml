apiVersion: v1
kind: PersistentVolume
metadata:
  name: kornilov-postgres-pv
spec:
  storageClassName: manual
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/kornilov-lab6-postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kornilov-postgres-pvc
  namespace: kornilov-ns
spec:
  storageClassName: manual
  volumeName: kornilov-postgres-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
