{% extends "analyses/base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="card card--narrow">
  <h1>Регистрация</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "analyses/_form_fields.html" %}
    <div class="actions">
      <button type="submit" class="btn">Зарегистрироваться</button>
    </div>
  </form>
  <p class="muted">Уже есть учётная запись? <a href="{% url 'login' %}">Вход</a></p>
</section>
{% endblock %}
